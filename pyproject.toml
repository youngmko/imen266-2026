[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imen266"
version = "0.2.0"
description = "Course library for IMEN266 Operations Research II (POSTECH)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools]
packages = ["imen266"]
